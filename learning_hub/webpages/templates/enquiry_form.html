<!DOCTYPE html>
<html lang="en">
{% load static %}

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Learning Hub</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">

    <link rel="stylesheet" href="{% static 'css/style.css' %}">
    <link rel="stylesheet" href="{% static 'css/login.css' %}">
</head>

<body>
    <header>
        {% include "header.html" %}
    </header>
    <main>
        <h2 class="text-center text-white mt-3  mb-4">Enquiry form</h2>
        <div class="page mt-5 mb-5">
            <div class="container1">
                <h2 class="texth2"></h2>
                <form method="post">
                    {% csrf_token %}
                    <div class="form-group">
                        {{ form.firstName }}
                        <label for="name">First Name</label>
                        <i class="bi bi-person"></i>
                    </div>
                    <div class="form-group">
                        {{ form.lastName }}
                        <label for="name">Last Name</label>
                        <i class="bi bi-person"></i>
                    </div>
                    <div class="form-group">
                        {{ form.contactNumber }}
                        <label for="mobile">Mobile number</label>
                        <i class="bi bi-phone"></i>

                    </div>
                    <div class="form-group">
                        {{ form.Email }}
                        <label for="email">Email </label>
                        <i class="bi bi-envelope"></i>
                    </div>
                    <div class="form-group">
                        {{ form.courses }}
                        <label for="email">Course </label>
                        <i class="bi bi-book"></i>
                    </div>
                    <button type="submit" class="btn1" value="submit">submit</button>
                    <button type="reset" class="btn1" value="reset">reset</button>
                </form>
            </div>
        </div>
        <!--product section start -->
    </main>
    <footer>
        {% include "footer.html" %}
    </footer>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
</body>

</html>
